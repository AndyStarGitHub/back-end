repos:
  # ruff (lint + autofix дрібних речей)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]     # дозволяємо автофікси (whitespace, unused imports тощо)

  # isort (сортування імпортів, узгоджено з black)
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        additional_dependencies: []
        # isort читає налаштування з pyproject.toml

  # black (форматування коду)
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black

# Можна додати глобальні виключення (опційно)
# files: \.(py|pyi)$
